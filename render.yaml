# Render blueprint for the Foster Connect API.
# Render dashboard → New → Blueprint → pick this repository.
# Secrets marked sync: false are typed into the dashboard, never committed.
services:
  - type: web
    name: foster-connect-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGINS
        value: https://advikar.github.io
      - key: CHAT_SIGNING_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      # Any OpenAI-compatible chat-completions endpoint. To switch providers,
      # change these two and LLM_API_KEY in the dashboard (docs/DEPLOY.md).
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
